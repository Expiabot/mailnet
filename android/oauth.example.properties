# Identifiants des clients OAuth. Publics (une application installee ne
# recoit aucun secret) mais propres a chaque installation : copiez ce
# fichier en oauth.properties et completez-le.
googleClientId=000000000000-exemple.apps.googleusercontent.com

# Inscription Entra, plateforme Android. Le hachage est le base64 des
# octets de l'empreinte SHA-1 du certificat de signature, pas sa forme
# hexadecimale.
microsoftClientId=00000000-0000-0000-0000-000000000000
microsoftSignatureHash=xxxxxxxxxxxxxxxxxxxxxxxxxxx=
